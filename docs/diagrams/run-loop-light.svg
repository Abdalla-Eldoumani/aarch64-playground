<svg xmlns="http://www.w3.org/2000/svg" width="800" height="888" viewBox="0 0 800 888" role="img" aria-labelledby="title" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
<title id="title">Run sequence: run asks the worker for up to 1,000,000 steps; the worker loops in 10,000-step chunks, in which every step keeps the call stack up to date, yields between them, asks the emulator for frames() and sends a StateSnapshot at most every 50 ms that updates the panels and console during the run; the final reply redraws the panels, and a run that stopped to wait for input starts again when you send a line</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#565E68"/></marker>
</defs>
<rect width="800" height="888" fill="#FCFCFD"/>

<rect x="16" y="24" width="160" height="56" rx="4" fill="#FFFFFF" stroke="#0C6882" stroke-width="2"/>
<text x="96" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#14161A">You</text>
<text x="96" y="68" text-anchor="middle" fill="#565E68">at the controls</text>

<rect x="208" y="24" width="176" height="56" rx="4" fill="#FFFFFF" stroke="#7A818C" stroke-width="2"/>
<text x="296" y="48" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#14161A">use-emulator.ts</text>
<text x="296" y="68" text-anchor="middle" fill="#565E68">main thread</text>

<rect x="416" y="24" width="176" height="56" rx="4" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
<text x="504" y="48" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#14161A">emulator.worker.ts</text>
<text x="504" y="68" text-anchor="middle" fill="#565E68">Web Worker</text>

<rect x="624" y="24" width="160" height="56" rx="4" fill="#FFFFFF" stroke="#81520C" stroke-width="2"/>
<text x="704" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#14161A">Emulator</text>
<text x="704" y="68" text-anchor="middle" fill="#565E68">Rust, as wasm</text>

<path d="M96 80V752" fill="none" stroke="#C9CED6" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M296 80V840" fill="none" stroke="#C9CED6" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M504 80V840" fill="none" stroke="#C9CED6" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M704 80V512" fill="none" stroke="#C9CED6" stroke-width="1" stroke-dasharray="4 4"/>

<path d="M96 112H296" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="196" y="104" text-anchor="middle" fill="#565E68">press run</text>

<path d="M296 160H504" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#565E68">runUntilBreak</text>
<text x="400" y="180" text-anchor="middle" fill="#565E68">1,000,000 steps at most</text>

<rect x="320" y="200" width="464" height="384" rx="4" fill="none" stroke="#7A818C" stroke-width="1"/>
<text x="332" y="222" font-weight="600" fill="#565E68">loop in run-loop.ts</text>
<text x="332" y="262" fill="#565E68">ends on: halt, error,</text>
<text x="332" y="280" fill="#565E68">breakpoint, a read</text>
<text x="332" y="298" fill="#565E68">with no input, sleep,</text>
<text x="332" y="316" fill="#565E68">or 1,000,000 steps</text>

<path d="M504 256H704" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="604" y="248" text-anchor="middle" fill="#565E68">run 10,000 steps</text>

<path d="M704 272H744V336H704" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="696" y="282" text-anchor="end" fill="#565E68">each step updates</text>
<text x="696" y="300" text-anchor="end" fill="#565E68">the call stack:</text>
<text x="696" y="318" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#565E68">track_call_or_return,</text>
<text x="696" y="336" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#565E68">watch_frame_records</text>

<path d="M704 376H504" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="604" y="368" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#565E68">RunResult</text>

<path d="M504 400H544V424H504" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="552" y="410" fill="#565E68">yield, then stop if</text>
<text x="552" y="428" fill="#565E68">paused or reset</text>

<path d="M504 464H704" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="604" y="456" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#565E68">frames()</text>
<text x="604" y="482" text-anchor="middle" fill="#565E68">once per snapshot</text>

<path d="M704 512H504" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="604" y="504" text-anchor="middle" fill="#565E68">the call stack, as numbers</text>

<path d="M504 544H296" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="536" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#565E68">StateSnapshot</text>
<text x="400" y="562" text-anchor="middle" fill="#565E68">at most every 50 ms</text>

<path d="M296 544H96" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="196" y="536" text-anchor="middle" fill="#565E68">panels, console update</text>
<text x="196" y="562" text-anchor="middle" fill="#565E68">during the run</text>

<path d="M504 616H296" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="608" text-anchor="middle" fill="#565E68">final reply</text>
<text x="400" y="634" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#565E68">StateSnapshot</text>

<path d="M296 664H96" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="196" y="656" text-anchor="middle" fill="#565E68">panels redraw</text>

<rect x="24" y="688" width="760" height="136" rx="4" fill="none" stroke="#7A818C" stroke-width="1"/>
<text x="772" y="710" text-anchor="end" font-weight="600" fill="#565E68">if the run stopped to wait for input</text>

<path d="M96 728H296" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="196" y="720" text-anchor="middle" fill="#565E68">send a line</text>

<path d="M296 768H504" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="760" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#565E68">pushStdin</text>

<path d="M296 808H504" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="800" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#565E68">runUntilBreak</text>

<rect x="32" y="858" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0C6882" stroke-width="2"/>
<text x="56" y="869" fill="#565E68">you and your code</text>
<rect x="200" y="858" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7A818C" stroke-width="2"/>
<text x="224" y="869" fill="#565E68">page code</text>
<rect x="320" y="858" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
<text x="344" y="869" fill="#565E68">worker</text>
<rect x="424" y="858" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#81520C" stroke-width="2"/>
<text x="448" y="869" fill="#565E68">Rust interpreter</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="672" viewBox="0 0 800 672" role="img" aria-labelledby="title" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
<title id="title">System map: the page's useEmulator hub takes the source from the editor and the args from the args box, sends requests through WorkerClient to the emulator worker, which calls the Rust emulator, and each reply carries a StateSnapshot back to the panels; the frames view draws the call stack from each snapshot's frames and the frameLayout read once per assemble</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A5ACB6"/></marker>
</defs>
<rect width="800" height="672" fill="#0B0C10"/>

<rect x="16" y="16" width="768" height="392" rx="4" fill="none" stroke="#3A414C" stroke-width="1" stroke-dasharray="4 4"/>
<text x="32" y="40" font-weight="600" fill="#A5ACB6">Main thread (the page)</text>
<rect x="16" y="448" width="768" height="168" rx="4" fill="none" stroke="#3A414C" stroke-width="1" stroke-dasharray="4 4"/>
<text x="32" y="472" font-weight="600" fill="#A5ACB6">Web Worker</text>

<rect x="316" y="56" width="168" height="64" rx="4" fill="#14171D" stroke="#3EC5E8" stroke-width="2"/>
<text x="400" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#EDEEF1">Args box</text>
<text x="400" y="103" text-anchor="middle" fill="#A5ACB6">program arguments</text>

<rect x="32" y="168" width="168" height="64" rx="4" fill="#14171D" stroke="#3EC5E8" stroke-width="2"/>
<text x="116" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#EDEEF1">Editor</text>
<text x="116" y="215" text-anchor="middle" fill="#A5ACB6">your .asm files</text>

<rect x="316" y="168" width="168" height="64" rx="4" fill="#14171D" stroke="#6E7582" stroke-width="2"/>
<text x="400" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#EDEEF1">useEmulator()</text>
<text x="400" y="215" text-anchor="middle" fill="#A5ACB6">one per playground</text>

<rect x="600" y="120" width="168" height="64" rx="4" fill="#14171D" stroke="#6E7582" stroke-width="2"/>
<text x="684" y="147" text-anchor="middle" font-size="14" font-weight="600" fill="#EDEEF1">Panels</text>
<text x="684" y="167" text-anchor="middle" fill="#A5ACB6">registers, memory</text>

<rect x="600" y="208" width="168" height="80" rx="4" fill="#14171D" stroke="#6E7582" stroke-width="2"/>
<text x="684" y="235" text-anchor="middle" font-size="14" font-weight="600" fill="#EDEEF1">Frames view</text>
<text x="684" y="255" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#A5ACB6">stack-frames.ts</text>
<text x="684" y="273" text-anchor="middle" fill="#A5ACB6">reads the stack's bytes</text>

<rect x="32" y="312" width="168" height="64" rx="4" fill="#14171D" stroke="#6E7582" stroke-width="2" stroke-dasharray="6 4"/>
<text x="116" y="339" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#EDEEF1">MainThreadBackend</text>
<text x="116" y="359" text-anchor="middle" fill="#A5ACB6">wasm in the page</text>

<rect x="316" y="312" width="168" height="64" rx="4" fill="#14171D" stroke="#6E7582" stroke-width="2"/>
<text x="400" y="339" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#EDEEF1">WorkerClient</text>
<text x="400" y="359" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#A5ACB6">worker/client.ts</text>

<rect x="316" y="488" width="168" height="64" rx="4" fill="#14171D" stroke="#B49BFF" stroke-width="2"/>
<text x="400" y="515" text-anchor="middle" font-size="14" font-weight="600" fill="#EDEEF1">Worker</text>
<text x="400" y="535" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#A5ACB6">emulator.worker.ts</text>

<rect x="616" y="488" width="152" height="64" rx="4" fill="#14171D" stroke="#FFB224" stroke-width="2"/>
<text x="692" y="515" text-anchor="middle" font-size="14" font-weight="600" fill="#EDEEF1">Emulator</text>
<text x="692" y="535" text-anchor="middle" fill="#A5ACB6">Rust, as wasm</text>

<path d="M400 120V168" fill="none" stroke="#A5ACB6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="408" y="149" fill="#A5ACB6">args</text>

<path d="M200 200H316" fill="none" stroke="#A5ACB6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="258" y="192" text-anchor="middle" fill="#A5ACB6">source</text>

<path d="M484 176H600" fill="none" stroke="#A5ACB6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="542" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#A5ACB6">StateSnapshot</text>

<path d="M484 224H600" fill="none" stroke="#A5ACB6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="542" y="198" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#A5ACB6">frames,</text>
<text x="542" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#A5ACB6">frameLayout</text>

<path d="M432 232V312" fill="none" stroke="#A5ACB6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="440" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#A5ACB6">assemble, step,</text>
<text x="440" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#A5ACB6">runUntilBreak,</text>
<text x="440" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#A5ACB6">frameLayout</text>

<path d="M344 232V256H116V312" fill="none" stroke="#A5ACB6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="230" y="249" text-anchor="middle" fill="#A5ACB6">or, with no Worker</text>

<path d="M372 376V488" fill="none" stroke="#A5ACB6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="364" y="437" text-anchor="end" fill="#A5ACB6">Request</text>

<path d="M428 488V376" fill="none" stroke="#A5ACB6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="436" y="437" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#A5ACB6">StateSnapshot</text>

<path d="M484 512H616" fill="none" stroke="#A5ACB6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="550" y="486" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#A5ACB6">step,</text>
<text x="550" y="504" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#A5ACB6">run_until_break</text>

<path d="M484 536H616" fill="none" stroke="#A5ACB6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="550" y="574" text-anchor="middle" fill="#A5ACB6"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">frames()</tspan> per snapshot,</text>
<text x="550" y="592" text-anchor="middle" fill="#A5ACB6"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">frame_layout()</tspan> per assemble</text>

<rect x="32" y="638" width="16" height="12" rx="2" fill="#14171D" stroke="#3EC5E8" stroke-width="2"/>
<text x="56" y="649" fill="#A5ACB6">you and your code</text>
<rect x="200" y="638" width="16" height="12" rx="2" fill="#14171D" stroke="#6E7582" stroke-width="2"/>
<text x="224" y="649" fill="#A5ACB6">page code</text>
<rect x="320" y="638" width="16" height="12" rx="2" fill="#14171D" stroke="#B49BFF" stroke-width="2"/>
<text x="344" y="649" fill="#A5ACB6">worker</text>
<rect x="424" y="638" width="16" height="12" rx="2" fill="#14171D" stroke="#FFB224" stroke-width="2"/>
<text x="448" y="649" fill="#A5ACB6">Rust interpreter</text>
</svg>

<text x="40" y="46" font-size="11" fill="#81520C" font-weight="600" text-anchor="start" letter-spacing="2">02 · ASSEMBLE</text>
<text x="40" y="72" font-size="20" fill="#14161A" font-weight="600" text-anchor="start">From source text to a loaded image</text>
<line x1="40" y1="88" x2="1160" y2="88" stroke="#C9CED6" stroke-width="1"/>
<text x="1160" y="46" font-size="11" fill="#8A929C" font-weight="400" text-anchor="end">aarch64-playground · architecture · sheet 2/4</text>
<rect x="40" y="160" width="196" height="62" fill="#FFFFFF" stroke="#14161A" stroke-width="1"/>
<text x="138.0" y="188.0" font-size="12" fill="#14161A" font-weight="600" text-anchor="middle">m4.rs</text>
<text x="138.0" y="203.0" font-size="10.5" fill="#565E68" font-weight="400" text-anchor="middle">define(NAME, BODY)</text>
<text x="138.0" y="238" font-size="9.5" fill="#8A929C" font-weight="400" text-anchor="middle">expands macros, bounded</text>
<text x="138.0" y="251" font-size="9.5" fill="#8A929C" font-weight="400" text-anchor="middle">records name=expr per offset</text>
<path d="M 236 191.0 L 271 191.0" fill="none" stroke="#14161A" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="271" y="160" width="196" height="62" fill="#FFFFFF" stroke="#14161A" stroke-width="1"/>
<text x="369.0" y="188.0" font-size="12" fill="#14161A" font-weight="600" text-anchor="middle">lexer.rs</text>
<text x="369.0" y="203.0" font-size="10.5" fill="#565E68" font-weight="400" text-anchor="middle">tokens</text>
<text x="369.0" y="238" font-size="9.5" fill="#8A929C" font-weight="400" text-anchor="middle">each token carries</text>
<text x="369.0" y="251" font-size="9.5" fill="#8A929C" font-weight="400" text-anchor="middle">original_line</text>
<path d="M 467 191.0 L 502 191.0" fill="none" stroke="#14161A" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="502" y="160" width="196" height="62" fill="#FFFFFF" stroke="#14161A" stroke-width="1"/>
<text x="600.0" y="188.0" font-size="12" fill="#14161A" font-weight="600" text-anchor="middle">parser.rs</text>
<text x="600.0" y="203.0" font-size="10.5" fill="#565E68" font-weight="400" text-anchor="middle">one statement per line</text>
<text x="600.0" y="238" font-size="9.5" fill="#8A929C" font-weight="400" text-anchor="middle">directive, instruction,</text>
<text x="600.0" y="251" font-size="9.5" fill="#8A929C" font-weight="400" text-anchor="middle">label, or assignment</text>
<path d="M 698 191.0 L 733 191.0" fill="none" stroke="#14161A" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="733" y="160" width="196" height="62" fill="#FFFFFF" stroke="#14161A" stroke-width="1"/>
<text x="831.0" y="188.0" font-size="12" fill="#14161A" font-weight="600" text-anchor="middle">sections.rs</text>
<text x="831.0" y="203.0" font-size="10.5" fill="#565E68" font-weight="400" text-anchor="middle">.text .rodata .data .bss</text>
<text x="831.0" y="238" font-size="9.5" fill="#8A929C" font-weight="400" text-anchor="middle">groups items</text>
<text x="831.0" y="251" font-size="9.5" fill="#8A929C" font-weight="400" text-anchor="middle">by section</text>
<path d="M 929 191.0 L 964 191.0" fill="none" stroke="#14161A" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="964" y="160" width="196" height="62" fill="#FFFFFF" stroke="#14161A" stroke-width="1"/>
<text x="1062.0" y="188.0" font-size="12" fill="#14161A" font-weight="600" text-anchor="middle">pipeline.rs</text>
<text x="1062.0" y="203.0" font-size="10.5" fill="#565E68" font-weight="400" text-anchor="middle">link</text>
<text x="1062.0" y="238" font-size="9.5" fill="#8A929C" font-weight="400" text-anchor="middle">places labels, two passes</text>
<text x="1062.0" y="251" font-size="9.5" fill="#8A929C" font-weight="400" text-anchor="middle">sizes the ldr xN, =expr pool,</text>
<text x="1062.0" y="264" font-size="9.5" fill="#8A929C" font-weight="400" text-anchor="middle">plants a BL trampoline per libc symbol</text>
<rect x="40" y="330" width="196" height="52" fill="#DDF1F5" stroke="#0E7490" stroke-width="1"/>
<text x="138.0" y="353.0" font-size="12" fill="#14161A" font-weight="600" text-anchor="middle">Editor buffers</text>
<text x="138.0" y="368.0" font-size="10.5" fill="#565E68" font-weight="400" text-anchor="middle">main.asm and helper files</text>
<path d="M 138 330 L 138 222" fill="none" stroke="#0E7490" stroke-width="1.25" marker-end="url(#arrow-cyan)"/>
<text x="146" y="280" font-size="10" fill="#0E7490" font-weight="400" text-anchor="start">helpers concatenated</text>
<text x="146" y="293" font-size="10" fill="#0E7490" font-weight="400" text-anchor="start">behind main</text>
<rect x="964" y="340" width="196" height="56" fill="#FFFFFF" stroke="#14161A" stroke-width="1"/>
<text x="1062.0" y="365.0" font-size="12" fill="#14161A" font-weight="600" text-anchor="middle">assembler.rs</text>
<text x="1062.0" y="380.0" font-size="10.5" fill="#565E68" font-weight="400" text-anchor="middle">encode_line_absolute</text>
<path d="M 1062.0 272 L 1062.0 340" fill="none" stroke="#14161A" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="1070.0" y="312" font-size="10.5" fill="#14161A" font-weight="400" text-anchor="start">each line</text>
<rect x="964" y="450" width="196" height="56" fill="#F6EBD3" stroke="#81520C" stroke-width="1"/>
<text x="1062.0" y="475.0" font-size="12" fill="#14161A" font-weight="600" text-anchor="middle">LinkedImage</text>
<text x="1062.0" y="490.0" font-size="10.5" fill="#565E68" font-weight="400" text-anchor="middle">section bytes, entry, line map</text>
<path d="M 1062.0 396 L 1062.0 450" fill="none" stroke="#81520C" stroke-width="1.25" marker-end="url(#arrow-amber)"/>
<rect x="660" y="450" width="220" height="56" fill="#F6EBD3" stroke="#81520C" stroke-width="1"/>
<text x="770.0" y="475.0" font-size="12" fill="#14161A" font-weight="600" text-anchor="middle">Cpu::load_linked_image</text>
<text x="770.0" y="490.0" font-size="10.5" fill="#565E68" font-weight="400" text-anchor="middle">reset, map pages, write</text>
<text x="770" y="520" font-size="9.5" fill="#8A929C" font-weight="400" text-anchor="middle">sections, __main_return in LR</text>
<path d="M 964 478 L 880 478" fill="none" stroke="#81520C" stroke-width="1.25" marker-end="url(#arrow-amber)"/>
<rect x="360" y="450" width="200" height="56" fill="#F4F5F7" stroke="#565E68" stroke-width="1"/>
<text x="460.0" y="475.0" font-size="12" fill="#14161A" font-weight="600" text-anchor="middle">Line map</text>
<text x="460.0" y="490.0" font-size="10.5" fill="#565E68" font-weight="400" text-anchor="middle">address to original_line</text>
<path d="M 660 478 L 560 478" fill="none" stroke="#14161A" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="610" y="464" font-size="10" fill="#14161A" font-weight="400" text-anchor="middle">one per instruction</text>
<rect x="40" y="450" width="220" height="56" fill="#DDF1F5" stroke="#0E7490" stroke-width="1"/>
<text x="150.0" y="475.0" font-size="12" fill="#14161A" font-weight="600" text-anchor="middle">Monaco markers</text>
<text x="150.0" y="490.0" font-size="10.5" fill="#565E68" font-weight="400" text-anchor="middle">errors, current line, breakpoints</text>
<path d="M 360 478 L 260 478" fill="none" stroke="#0E7490" stroke-width="1.25" marker-end="url(#arrow-cyan)"/>
<text x="40" y="560" font-size="11" fill="#565E68" font-weight="400" text-anchor="start">Every pipeline error carries original_line, so a diagnostic lands on the line the student wrote, before m4 touched it.</text>
<text x="40" y="576" font-size="11" fill="#565E68" font-weight="400" text-anchor="start">Source without .global main, sections, or a libc reference takes the older one-pass bare-metal assembler instead.</text>
<text x="40" y="592" font-size="11" fill="#565E68" font-weight="400" text-anchor="start">The linker matches GAS: label immediates fold to section offsets and symbol+offset resolves before the adrp page split.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
<title id="title">Step back: each step pushes a frame of what it overwrote onto a ring of the last 128 steps, back undoes the newest frame, and named saves are whole copies kept beside the ring</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#565E68"/></marker>
</defs>
<rect width="800" height="360" fill="#FCFCFD"/>

<rect x="32" y="56" width="184" height="80" rx="4" fill="#FFFFFF" stroke="#81520C" stroke-width="2"/>
<text x="124" y="84" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#14161A">Cpu</text>
<text x="124" y="104" text-anchor="middle" fill="#565E68">registers, memory,</text>
<text x="124" y="122" text-anchor="middle" fill="#565E68">heap, input, files</text>

<rect x="312" y="24" width="472" height="152" rx="4" fill="none" stroke="#7A818C" stroke-width="1"/>
<text x="336" y="48" font-weight="600" fill="#565E68">the last 128 steps; the oldest drops off</text>
<rect x="336" y="72" width="64" height="48" rx="4" fill="#FFFFFF" stroke="#81520C" stroke-width="2"/>
<text x="368" y="101" text-anchor="middle" fill="#14161A">newest</text>
<rect x="408" y="72" width="64" height="48" rx="4" fill="#FFFFFF" stroke="#81520C" stroke-width="2"/>
<rect x="480" y="72" width="64" height="48" rx="4" fill="#FFFFFF" stroke="#81520C" stroke-width="2"/>
<text x="584" y="101" text-anchor="middle" font-size="14" fill="#565E68">…</text>
<rect x="624" y="72" width="64" height="48" rx="4" fill="#FFFFFF" stroke="#81520C" stroke-width="2"/>
<rect x="696" y="72" width="64" height="48" rx="4" fill="#FFFFFF" stroke="#81520C" stroke-width="2"/>
<text x="728" y="101" text-anchor="middle" fill="#14161A">oldest</text>
<text x="336" y="152" fill="#565E68">a frame holds what its step overwrote</text>

<path d="M216 84H336" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="264" y="76" text-anchor="middle" fill="#565E68">step</text>

<path d="M336 108H216" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="264" y="130" text-anchor="middle" fill="#565E68">back</text>

<rect x="312" y="224" width="288" height="80" rx="4" fill="#FFFFFF" stroke="#81520C" stroke-width="2"/>
<text x="456" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#14161A">named saves</text>
<text x="456" y="272" text-anchor="middle" fill="#565E68">whole copies, kept on reset</text>
<text x="456" y="290" text-anchor="middle" fill="#565E68">pages shared until written</text>

<path d="M96 136V248H312" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="204" y="240" text-anchor="middle" fill="#565E68">save</text>

<path d="M312 280H152V136" fill="none" stroke="#565E68" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="232" y="300" text-anchor="middle" fill="#565E68">load: clears the ring</text>

<rect x="32" y="330" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#81520C" stroke-width="2"/>
<text x="56" y="341" fill="#565E68">Rust interpreter</text>
</svg>

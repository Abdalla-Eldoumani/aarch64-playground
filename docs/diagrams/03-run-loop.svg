<text x="970.0" y="354" font-size="10.5" fill="#81520C" font-weight="400" text-anchor="middle">StepOutcome</text>
<text x="970" y="368" font-size="10" fill="#565E68" font-weight="400" text-anchor="middle">Advance, Halted, WaitingForInput, Sleeping, Exited</text>
<text x="955" y="392" font-size="10" fill="#565E68" font-weight="400" text-anchor="middle">yield to the event loop; re-read the pause flag</text>
<text x="955" y="406" font-size="10" fill="#565E68" font-weight="400" text-anchor="middle">and the machine generation before the next chunk</text>
<path d="M 850 432 L 600 432" fill="none" stroke="#81520C" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
<text x="725.0" y="426" font-size="10.5" fill="#81520C" font-weight="400" text-anchor="middle">heartbeat StateSnapshot, at most one per 50 ms</text>
<path d="M 600 452 L 350 452" fill="none" stroke="#81520C" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
<text x="475.0" y="446" font-size="10.5" fill="#81520C" font-weight="400" text-anchor="middle">onSnapshot(snapshot)</text>
<text x="350" y="472" font-size="10" fill="#565E68" font-weight="400" text-anchor="middle">panels re-render from the snapshot: registers,</text>
<text x="350" y="486" font-size="10" fill="#565E68" font-weight="400" text-anchor="middle">changedRegs, dirtyAddrs, stdoutDelta, pc</text>
<path d="M 850 506 L 600 506" fill="none" stroke="#14161A" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="725.0" y="500" font-size="10.5" fill="#14161A" font-weight="400" text-anchor="middle">done: breakpoint, halt, blocked read, sleep budget, or step wall</text>
<path d="M 600 526 L 350 526" fill="none" stroke="#81520C" stroke-width="1.25" marker-end="url(#arrow-amber)"/>
<text x="475.0" y="520" font-size="10.5" fill="#81520C" font-weight="400" text-anchor="middle">final StateSnapshot</text>
<path d="M 350 544 L 110 544" fill="none" stroke="#81520C" stroke-width="1.25" marker-end="url(#arrow-amber)"/>
<text x="230.0" y="538" font-size="10.5" fill="#81520C" font-weight="400" text-anchor="middle">console, markers, panels settle</text>
<text x="40" y="580" font-size="11" fill="#565E68" font-weight="400" text-anchor="start">Bounds hold inside the machine, whatever the source: 10,000,000 cumulative steps, 8,192 mapped pages (32 MiB), 4 MiB of output.</text>
<text x="40" y="596" font-size="11" fill="#565E68" font-weight="400" text-anchor="start">A step-back ring keeps 128 frames before each step; a WaitingForInput outcome parks the loop until stdin arrives.</text>
</svg>
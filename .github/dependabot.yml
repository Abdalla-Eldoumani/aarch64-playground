version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /emulator
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The root manifest is not listed: its `next` entry exists only for Vercel's
  # framework detection, and its `postcss` override moves with web/'s.

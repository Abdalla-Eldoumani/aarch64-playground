name: node setup
description: >-
  Puts node on PATH and restores web/node_modules from a cache keyed on the
  dependency graph, running npm ci only on a miss. Every web job calls this,
  so the install policy lives in one place.
  Like every cache in check.yml, it restores on any run and saves only
  outside pull requests.

inputs:
  node-version:
    description: node major, the same value the calling workflow pins
    required: true

runs:
  using: composite
  steps:
    # setup-node's own npm cache would restore ~/.npm in every job and save
    # it in a post step; the steps below restore it only on a miss.
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    # The project's own `version` fields are stripped so a release bump still
    # hits the cache. No restore-keys: npm ci deletes node_modules first, so
    # only an exact hit saves anything.
    - name: dependency hash
      id: lock
      shell: bash
      run: |
        node -e '
          const fs = require("fs");
          const crypto = require("crypto");
          const strip = (file) => {
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            delete json.version;
            if (json.packages && json.packages[""]) delete json.packages[""].version;
            return JSON.stringify(json);
          };
          const hash = crypto.createHash("sha256")
            .update(strip("web/package.json"))
            .update(strip("web/package-lock.json"))
            .digest("hex");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `hash=${hash}\n`);
        '

    - name: restore node_modules
      id: nm
      uses: actions/cache/restore@v6
      with:
        path: web/node_modules
        key: ${{ runner.os }}-node${{ inputs.node-version }}-nm-${{ steps.lock.outputs.hash }}

    # The ~/.npm tarball cache only matters on a node_modules miss, where it
    # turns the install from a download into a link.
    - name: restore npm tarballs
      id: npm
      if: steps.nm.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
        restore-keys: ${{ runner.os }}-npm-

    # package.json is in the key so an edit to it without a lockfile refresh
    # misses the cache and fails here, where npm ci checks the two agree.
    - name: install
      if: steps.nm.outputs.cache-hit != 'true'
      shell: bash
      working-directory: web
      run: npm ci --no-audit --no-fund

    - name: save node_modules
      if: steps.nm.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
      uses: actions/cache/save@v6
      with:
        path: web/node_modules
        key: ${{ steps.nm.outputs.cache-primary-key }}

    - name: save npm tarballs
      if: steps.nm.outputs.cache-hit != 'true' && steps.npm.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
      uses: actions/cache/save@v6
      with:
        path: ~/.npm
        key: ${{ steps.npm.outputs.cache-primary-key }}

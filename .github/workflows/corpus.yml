name: corpus

# Rebuilds the C corpus with a cross gcc and qemu-user and fails when a
# program's output or exit code no longer matches the tracked references, so
# a toolchain change cannot go unnoticed. Assembly differing from the course
# server's gcc output is only reported. The second job replays the two -O2
# tiers in the emulator, which pull requests skip as they triple its time.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  regen:
    name: rebuild and compare behaviour (cross gcc + qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user

      - name: regenerate and compare
        run: python3 emulator/tests/c-corpus/tools/sanitize.py regen

  optimized:
    name: replay the optimized tiers (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: -O2 and plain -O2 against the tracked references
        run: cargo test --manifest-path emulator/Cargo.toml --test c_corpus -- --ignored

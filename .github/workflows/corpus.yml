name: corpus

# Rebuilds the C corpus with a cross compiler and qemu-user at all three
# tiers (-O0, -O2 with the corpus flags, plain -O2) and fails when the
# rebuilt programs behave differently from the tracked references
# (stdout or exit code), so a toolchain change fails this run instead of
# going unnoticed. Assembly text is expected to differ (the references
# were recorded with the course server's own gcc) and is reported, never
# failed on. The second job replays the two optimized tiers in the
# emulator: the per-PR gate replays only -O0, because the other two
# triple its time.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  regen:
    name: rebuild and compare behaviour (cross gcc + qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user

      - name: regenerate and compare
        run: python3 emulator/tests/c-corpus/tools/sanitize.py regen

  optimized:
    name: replay the optimized tiers (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: -O2 and plain -O2 against the tracked references
        run: cargo test --manifest-path emulator/Cargo.toml --test c_corpus -- --ignored

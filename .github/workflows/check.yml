name: check

# integration is the batch branch: feature branches open their pull
# requests against it, and a pull request can only restore caches saved on
# its base branch or on main, so pushes to integration run here too and
# leave warm caches behind for every feature branch that follows.
on:
  push:
    branches: [main, integration]
  pull_request:
    branches: [main, integration]
  # The weekly run catches what breaks with no PR open: a new dependency
  # advisory (the audit gate below), a toolchain fetch failing, a registry
  # moving. Same cadence as the bounds workflow. It also refreshes every
  # cache on main, one of the two scopes a pull request can restore from.
  schedule:
    - cron: "0 6 * * 1"

# Cancel in-progress runs of this workflow on the same ref so a fast
# follow-up push doesn't pile up duplicate jobs.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NEXT_TELEMETRY_DISABLED: 1
  # One source for the node major so the node_modules cache keys can never
  # serve modules installed under a different node, and one each for the
  # rust toolchain and wasm-pack so a bump rolls every cargo and wasm
  # cache instead of leaving them restoring another compiler's artifacts.
  # The two rust pins match scripts/vercel-build.sh, so CI tests the
  # compiler that ships.
  NODE_VERSION: "24"
  RUST_TOOLCHAIN: "1.96.0"
  WASM_PACK_VERSION: "0.14.0"

# Every web job needs the wasm bundles, so the job that produces them does
# nothing else; everything downstream fans out in parallel behind it. The
# bundles are a pure function of the emulator sources and the two pinned
# tools, so they are cached on that key: a pull request that leaves the
# emulator alone restores them in seconds and never installs a toolchain.
# cargo test runs beside all of this rather than in front of it.
jobs:
  wasm:
    name: wasm-pack bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: restore wasm bundles
        id: bundles
        uses: actions/cache@v6
        with:
          path: |
            web/lib/wasm/
            web/lib/wasm-node/
          key: ${{ runner.os }}-wasm-out-${{ env.RUST_TOOLCHAIN }}-${{ env.WASM_PACK_VERSION }}-${{ hashFiles('emulator/src/**', 'emulator/Cargo.toml', 'emulator/Cargo.lock') }}

      # Third-party actions are pinned to full commit SHAs so a moved tag
      # cannot swap the code CI runs; the comment names the human-readable ref.
      - name: install rust toolchain
        if: steps.bundles.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      # This job and cargo test keep separate target caches on purpose: they
      # compile for different targets, and a shared key meant whichever job
      # saved first left the other recompiling its half on every run.
      - name: cache cargo
        if: steps.bundles.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emulator/target
          key: ${{ runner.os }}-cargo-wasm-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('emulator/Cargo.toml', 'emulator/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-${{ env.RUST_TOOLCHAIN }}-

      # taiki-e/install-action grabs prebuilt binaries via binstall when
      # available, which is faster and more reliable than the older
      # jetli/wasm-pack-action (that one rate-limits without a token on
      # newer GitHub runners).
      - name: install wasm-pack
        if: steps.bundles.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: wasm-pack web build
        if: steps.bundles.outputs.cache-hit != 'true'
        run: wasm-pack build emulator --release --target web --out-dir ../web/lib/wasm

      # The two targets share the cargo build; this one only re-runs bindgen.
      - name: wasm-pack node build
        if: steps.bundles.outputs.cache-hit != 'true'
        run: wasm-pack build emulator --release --target nodejs --out-dir ../web/lib/wasm-node

      - name: upload wasm artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-bundles
          path: |
            web/lib/wasm/
            web/lib/wasm-node/
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  # The corpus gate replays fifty gcc-compiled programs and was nearly all
  # of the cargo runtime, so the suite is partitioned the way the vitest
  # shards below are: one job runs every test except that gate, and three
  # more slice the corpus programs round-robin (CORPUS_SHARD, read by the
  # test itself; every program runs exactly once across the union). The
  # other half of the speedup lives in emulator/Cargo.toml: the test
  # profile runs at opt-level 1 with overflow checks and debug assertions
  # still on, because an unoptimized walk of the interpreter loop was
  # minutes of pure constant factor.
  rust:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cargo test
            args: "-- --skip corpus_at_o0"
            cache: test
          - name: cargo corpus 1/3
            args: "--test c_corpus"
            shard: "1/3"
            cache: corpus
          - name: cargo corpus 2/3
            args: "--test c_corpus"
            shard: "2/3"
            cache: corpus
          - name: cargo corpus 3/3
            args: "--test c_corpus"
            shard: "3/3"
            cache: corpus
    steps:
      - uses: actions/checkout@v7

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # The corpus shards compile an identical subset (the library plus one
      # test binary), so they share one cache key and whichever saves first
      # wins; the full-suite job keeps the key it always had rather than
      # letting a subset save evict the artifacts its next run restores.
      - name: cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emulator/target
          key: ${{ runner.os }}-cargo-${{ matrix.cache }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('emulator/Cargo.toml', 'emulator/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.cache }}-${{ env.RUST_TOOLCHAIN }}-

      - name: ${{ matrix.name }}
        env:
          CORPUS_SHARD: ${{ matrix.shard }}
        run: cargo test --manifest-path emulator/Cargo.toml ${{ matrix.args }}

  corpus:
    name: verify-corpus
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The corpus script runs on node alone (it loads the wasm bundle
      # directly), so this job skips the node_modules restore the other
      # web jobs go through.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: download wasm artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-bundles
          path: web/lib

      - name: verify-corpus
        run: node scripts/verify-corpus.js

  web-static:
    name: lint + typecheck + audit
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      # tsc needs the generated .d.ts from both wasm bundles to type-check.
      - name: download wasm artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-bundles
          path: web/lib

      # The production dependency gate: fails on any moderate-or-higher
      # advisory against a shipped dep. Dev-only tooling is watched by
      # Dependabot instead so its advisories don't block unrelated PRs.
      - name: dependency audit
        run: node scripts/audit-deps.js --omit=dev

      # security.txt promises a contact until its Expires date; the weekly
      # run fails a month before that date lapses instead of letting it
      # expire silently.
      - name: security.txt expiry
        run: |
          node -e '
            const m = require("fs").readFileSync("web/public/.well-known/security.txt", "utf8").match(/^Expires:\s*(\S+)/m);
            if (!m) { console.error("security.txt has no Expires line"); process.exit(1); }
            const days = (new Date(m[1]) - Date.now()) / 86400000;
            console.log(`security.txt expires in ${Math.floor(days)} days`);
            if (days < 30) { console.error("Expires is under 30 days away; refresh the date"); process.exit(1); }
          '

      - name: lint
        working-directory: web
        run: npm run lint

      - name: typecheck
        working-directory: web
        run: npm run typecheck

  web-build:
    name: next build + size-limit
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: download wasm artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-bundles
          path: web/lib

      # The webpack cache is content-addressed internally, so restoring a
      # stale entry is safe and still cuts the build roughly in half; the
      # per-sha key just keeps the newest one winning.
      - name: cache next build
        uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('web/package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: build
        working-directory: web
        run: npm run build

      # size-limit sums whatever its globs match, and an empty match sums to
      # zero and passes: a renamed chunk would un-measure itself silently.
      # Assert the named lazy chunks exist before trusting the budgets.
      - name: assert budget globs match real chunks
        working-directory: web
        run: node -e "const fs=require('fs');const files=fs.readdirSync('.next/static/chunks');const need=[/^monaco\..*\.js$/,/^monaco-worker\..*\.js$/,/^terminal\..*\.js$/];const missing=need.filter(re=>!files.some(f=>re.test(f)));if(missing.length){console.error('budget glob matched nothing:',missing.map(String).join(' '));process.exit(1)}"

      - name: size-limit
        working-directory: web
        run: npm run size

  # The suite is partitioned across six runners with vitest --shard; every
  # file runs exactly once across the union. Six because the slowest shard
  # is the critical path of the whole workflow and vitest splits by file
  # count, not by cost: four shards left the longest one at 80 s and the
  # merge job waiting on it.
  # A shard cannot judge the global coverage floor from its slice, so
  # VITEST_SHARD defers the thresholds to the coverage job, which merges
  # the blob reports and enforces them once.
  web-test:
    name: vitest shard ${{ matrix.shard }}
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: download wasm artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-bundles
          path: web/lib

      # The default reporter rides along so a failing test is readable right
      # in this job's log; the blob is only the merge job's input.
      - name: vitest
        working-directory: web
        env:
          # A flag, not the shard index: it only tells vitest to defer the floors.
          VITEST_SHARD: "1"
        run: npm test -- --coverage --reporter=blob --reporter=default --shard=${{ matrix.shard }}/6

      # .vitest/blob is where vitest 5 writes the blob (vitest 4 used
      # .vitest-reports). It is a dot-directory, which upload-artifact skips
      # unless told otherwise; without the flag this uploads nothing.
      - name: upload blob report
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: web/.vitest/blob/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  coverage:
    name: merge shards + coverage floors
    needs: web-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: web/.vitest/blob

      # Only reached when every shard passed (a failing shard fails its own
      # job and skips this one); merges the blobs into the one whole-suite
      # coverage report the floors judge.
      - name: merge reports and enforce coverage floors
        working-directory: web
        run: npm test -- --merge-reports --coverage

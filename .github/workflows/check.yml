name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of this workflow on the same ref so a fast
# follow-up push doesn't pile up duplicate jobs.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: cargo + wasm-pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Third-party actions are pinned to full commit SHAs so a moved tag
      # cannot swap the code CI runs; the comment names the human-readable ref.
      # The toolchain itself is pinned to the same version the deploy build
      # uses (scripts/vercel-build.sh), so CI tests the compiler that ships.
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown

      # Cache the cargo registry + git index + target dir so reruns don't
      # spend a full minute re-downloading + recompiling every dep.
      - name: cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emulator/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('emulator/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # taiki-e/install-action grabs prebuilt binaries via binstall when
      # available, which is faster and more reliable than the older
      # jetli/wasm-pack-action (that one rate-limits without a token on
      # newer GitHub runners).
      - name: install wasm-pack
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: wasm-pack@0.14.0

      - name: cargo test
        run: cargo test --manifest-path emulator/Cargo.toml

      - name: wasm-pack web build
        run: wasm-pack build emulator --release --target web --out-dir ../web/lib/wasm

      - name: wasm-pack node build
        run: wasm-pack build emulator --release --target nodejs --out-dir ../web/lib/wasm-node

      - name: upload wasm artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-bundles
          path: |
            web/lib/wasm/
            web/lib/wasm-node/
          retention-days: 1
          if-no-files-found: error

  web:
    name: web (lint + tsc + vitest + size-limit)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: download wasm artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-bundles
          path: web/lib

      - name: install
        working-directory: web
        run: npm ci --no-audit --no-fund

      # The production dependency gate: fails on any moderate-or-higher
      # advisory against a shipped dep. Dev-only tooling is watched by
      # Dependabot instead so its advisories don't block unrelated PRs.
      - name: dependency audit
        run: node scripts/audit-deps.js --omit=dev

      - name: lint
        working-directory: web
        run: npm run lint

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: vitest
        working-directory: web
        run: npm test -- --coverage

      - name: build
        working-directory: web
        run: npm run build

      - name: size-limit
        working-directory: web
        run: npm run size

  corpus:
    name: verify-corpus
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: download wasm artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-bundles
          path: web/lib

      - name: verify-corpus
        run: node scripts/verify-corpus.js

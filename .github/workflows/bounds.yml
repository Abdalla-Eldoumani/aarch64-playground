name: bounds

# The two end-to-end runaway-wall tests in emulator/tests/bounds.rs spend the
# real ~10M-step ceiling, which is too slow for the per-PR gate; they are
# #[ignore]d there and exercised here on a weekly schedule instead, in release
# mode where the walls run in seconds.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bounds:
    name: runaway walls (release, ignored tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: "1.96.0"

      - name: run the ignored bounds tests
        run: cargo test --release --manifest-path emulator/Cargo.toml --test bounds -- --ignored

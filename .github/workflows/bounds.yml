name: bounds

# The two tests in emulator/tests/bounds.rs that run a program until it hits
# the real step limit (a "runaway wall", about 10 million steps) are too slow
# for every pull request, so they are #[ignore]d there and run here weekly,
# in release mode, where they take seconds.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # In the cache key so a toolchain bump rolls the cache instead of leaving
  # it permanently restoring another compiler's artifacts.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  bounds:
    name: runaway walls (release, ignored tests)
    # Pinned so every workflow runs on the same image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Release artifacts, so this cache is its own key rather than sharing
      # the check workflow's debug caches.
      - name: cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emulator/target
          key: ${{ runner.os }}-cargo-bounds-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('emulator/Cargo.toml', 'emulator/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bounds-${{ env.RUST_TOOLCHAIN }}-

      - name: run the ignored bounds tests
        run: cargo test --release --manifest-path emulator/Cargo.toml --test bounds -- --ignored

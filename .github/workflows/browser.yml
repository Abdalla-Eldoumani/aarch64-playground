name: browser

# The browser suite every night on main. check.yml already ran Chromium on
# each push there; this catches what breaks with no new commit (the runner
# image and the Node 24 it carries, the system libraries playwright installs),
# and adds Firefox, which check.yml never runs.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NEXT_TELEMETRY_DISABLED: 1
  # The same pins as check.yml; .github/scripts/check-pins.js holds both to
  # scripts/vercel-build.sh.
  NODE_VERSION: "24"
  RUST_TOOLCHAIN: "1.96.0"
  WASM_PACK_VERSION: "0.14.0"

jobs:
  browsers:
    name: chromium + firefox smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The bundles check.yml cached for this commit's emulator sources; no
      # wasm job runs here to wait on, so a miss builds them below.
      - name: look up wasm bundles
        id: bundles
        uses: ./.github/actions/wasm-bundles
        with:
          lookup-only: "true"

      - name: restore wasm bundles
        if: steps.bundles.outputs.hit == 'true'
        uses: ./.github/actions/wasm-bundles

      - name: install rust toolchain
        if: steps.bundles.outputs.hit == 'false'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: install wasm-pack
        if: steps.bundles.outputs.hit == 'false'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: wasm-pack builds
        if: steps.bundles.outputs.hit == 'false'
        run: |
          wasm-pack build emulator --release --target web --out-dir ../web/lib/wasm
          wasm-pack build emulator --release --target nodejs --out-dir ../web/lib/wasm-node

      # The browsers that match web/'s pinned playwright.
      - name: install chromium and firefox
        working-directory: web
        run: npx playwright install --with-deps chromium firefox

      - name: build
        working-directory: web
        run: npm run build

      # Background processes outlive their step; the readiness poll gives up
      # after a minute and prints the server's log.
      - name: start the production server
        id: server
        working-directory: web
        run: |
          nohup npx next start -p 3000 > "$RUNNER_TEMP/next.log" 2>&1 &
          for _ in $(seq 60); do
            if curl -fsS -o /dev/null http://localhost:3000/playground; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/next.log"
          exit 1

      - name: chromium smoke
        timeout-minutes: 5
        run: node scripts/browser-smoke.mjs

      # Headless Firefox: the editor renders, the security headers arrive,
      # and the console stays clean.
      - name: firefox smoke
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        timeout-minutes: 5
        run: node scripts/firefox-smoke.mjs

[package]
name = "aarch64-emulator"
version = "2.5.101"
edition = "2021"
# The toolchain the crate is actually built and tested with (CI and the
# deploy pin the same version); an older rustc gets this message instead of
# a bare missing-method error.
rust-version = "1.96"
description = "ARMv8 instruction emulator for the browser"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true

# The test profile keeps its safety nets (overflow-checks and
# debug-assertions stay on; only opt-level moves off zero) but stops
# interpreting the interpreter: the corpus gate replays tens of millions
# of emulator steps, and an unoptimized walk of that loop is minutes of
# pure constant factor.
[profile.test]
opt-level = 1

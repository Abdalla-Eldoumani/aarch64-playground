[package]
name = "aarch64-emulator"
version = "2.5.0"
edition = "2021"
# The toolchain the crate is actually built and tested with (CI and the
# deploy pin the same version); an older rustc gets this message instead of
# a bare missing-method error.
rust-version = "1.96"
description = "ARMv8 instruction emulator for the browser"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
